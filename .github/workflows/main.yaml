name: Deploy to Surge

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - run: npm install -g surge

      - run: surge ./ dailyn-ci1-2026.surge.sh --token 73edc3cd4beb8ca06c947eea4aad4c40
